<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="380" height="760">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cameraBg" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#26242b" />
      <stop offset="60%" stop-color="#151418" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </radialGradient>
    <filter id="purpleBtnGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#673ab7" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="6" y="6" width="408" height="828" rx="38" fill="url(#cameraBg)" stroke="#2a2a2e" stroke-width="4" />

  <!-- Darkened Camera Overlay Outside Cutout (Center Cutout: x=66, y=240, w=288, h=288) -->
  <path d="M 10 44
           H 410
           V 796
           H 10
           Z
           M 86 240
           H 334
           A 20 20 0 0 1 354 260
           V 508
           A 20 20 0 0 1 334 528
           H 86
           A 20 20 0 0 1 66 508
           V 260
           A 20 20 0 0 1 86 240
           Z"
        fill="#000000" fill-opacity="0.52" fill-rule="evenodd" />

  <!-- Top Gradient Overlay -->
  <rect x="10" y="10" width="400" height="120" rx="34" fill="url(#topGrad)" />

  <!-- Status Bar (Top) -->
  <text x="36" y="34" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff" fill-opacity="0.9">9:41</text>
  <rect x="348" y="23" width="26" height="12" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5" />
  <rect x="351" y="26" width="18" height="6" rx="1.5" fill="#4caf50" />

  <!-- Top App Header: "POS Scanner" + Green "SCANNING" Pill -->
  <text x="28" y="82" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" fill="#ffffff">POS Scanner</text>

  <rect x="272" y="57" width="120" height="34" rx="17" fill="#43a047" />
  <circle cx="290" cy="74" r="4.5" fill="#ffffff" />
  <text x="304" y="78" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="0.6">SCANNING</text>

  <!-- Subtle Skincare Product Barcode Inside Camera Viewfinder -->
  <rect x="108" y="305" width="204" height="156" rx="8" fill="#1e1c24" stroke="#383442" stroke-width="1.5" />
  <text x="210" y="332" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="9.5" fill="#ff007f" text-anchor="middle" letter-spacing="1.5">PRISM SKINCARE</text>
  <text x="210" y="348" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" fill="#aaaaaa" text-anchor="middle">RELIEF SUN SPF50+ PA++++</text>

  <rect x="132" y="362" width="156" height="78" rx="4" fill="#ffffff" />
  <g fill="#111111">
    <rect x="146" y="372" width="3" height="46" />
    <rect x="152" y="372" width="1.5" height="46" />
    <rect x="157" y="372" width="4" height="46" />
    <rect x="164" y="372" width="2" height="46" />
    <rect x="169" y="372" width="3.5" height="46" />
    <rect x="176" y="372" width="1.5" height="46" />
    <rect x="181" y="372" width="5" height="46" />
    <rect x="189" y="372" width="2" height="46" />
    <rect x="194" y="372" width="3" height="46" />
    <rect x="200" y="372" width="4.5" height="46" />
    <rect x="208" y="372" width="2" height="46" />
    <rect x="213" y="372" width="3" height="46" />
    <rect x="219" y="372" width="5" height="46" />
    <rect x="227" y="372" width="1.5" height="46" />
    <rect x="232" y="372" width="4" height="46" />
    <rect x="239" y="372" width="2.5" height="46" />
    <rect x="245" y="372" width="4" height="46" />
    <rect x="252" y="372" width="2" height="46" />
    <rect x="257" y="372" width="3.5" height="46" />
    <rect x="264" y="372" width="2" height="46" />
    <rect x="269" y="372" width="3" height="46" />
  </g>
  <text x="210" y="432" font-family="Consolas, monospace" font-weight="700" font-size="10.5" fill="#111111" text-anchor="middle" letter-spacing="1.5">8809643051284</text>

  <!-- Deep Purple Viewfinder Corner Markers -->
  <g fill="none" stroke="#673ab7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left -->
    <path d="M 66 284 L 66 240 L 110 240" />
    <!-- Top-Right -->
    <path d="M 310 240 L 354 240 L 354 284" />
    <!-- Bottom-Left -->
    <path d="M 66 484 L 66 528 L 110 528" />
    <!-- Bottom-Right -->
    <path d="M 310 528 L 354 528 L 354 484" />
  </g>

  <!-- Bottom Gradient Overlay -->
  <rect x="10" y="560" width="400" height="270" rx="34" fill="url(#bottomGrad)" />

  <!-- Circular Scan Trigger Button -->
  <circle cx="210" cy="614" r="46" fill="#ffffff" fill-opacity="0.95" stroke="#673ab7" stroke-width="4" filter="url(#purpleBtnGlow)" />

  <!-- Purple QR Code Scanner Icon Inside Button -->
  <g fill="none" stroke="#673ab7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer scanner corners -->
    <path d="M 190 601 V 594 H 197" />
    <path d="M 223 594 H 230 V 601" />
    <path d="M 190 627 V 634 H 197" />
    <path d="M 223 634 H 230 V 627" />
    <!-- Inner QR squares -->
    <rect x="196" y="600" width="10" height="10" stroke-width="2.5" />
    <rect x="214" y="600" width="10" height="10" stroke-width="2.5" />
    <rect x="196" y="618" width="10" height="10" stroke-width="2.5" />
  </g>
  <!-- QR bottom-right dots -->
  <rect x="214" y="618" width="4" height="4" fill="#673ab7" />
  <rect x="220" y="618" width="4" height="4" fill="#673ab7" />
  <rect x="217" y="622" width="4" height="4" fill="#673ab7" />
  <rect x="214" y="625" width="4" height="4" fill="#673ab7" />
  <rect x="220" y="625" width="4" height="4" fill="#673ab7" />

  <!-- Label Below Button -->
  <text x="210" y="684" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff" fill-opacity="0.78" text-anchor="middle" letter-spacing="1.6">TAP BUTTON TO SCAN</text>

  <!-- Bottom Green Status Box ("Scanning...") -->
  <rect x="28" y="732" width="364" height="58" rx="16" fill="#4caf50" fill-opacity="0.2" stroke="#4caf50" stroke-width="2" />
  <circle cx="60" cy="761" r="11" fill="#4caf50" />
  <path d="M 55 761 L 58.5 764.5 L 65.5 757.5" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="84" y="766" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="16" fill="#4caf50">Scanning...</text>

  <!-- Mobile Home Indicator Bar -->
  <rect x="140" y="814" width="140" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.45" />
</svg>

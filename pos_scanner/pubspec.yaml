name: pos_scanner
description: "Barcode scanner for POS system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Camera & Barcode Scanning
  camera: ^0.10.5+5
  google_mlkit_barcode_scanning: ^0.10.0
  
  # API Communication
  http: ^1.1.2
  
  # Permissions
  permission_handler: ^11.0.1
  # UI & Feedback
  vibration: ^3.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/store-scanner-beep-90395.wav